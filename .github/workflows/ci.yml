name: Java CI with Maven and Testcontainers

# This triggers the pipeline every time you push to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab your code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Run the Maven build and all tests
      # (Ubuntu-latest already has Docker installed, so Testcontainers will work perfectly!)
      - name: Build and Test with Maven
        run: mvn clean verify