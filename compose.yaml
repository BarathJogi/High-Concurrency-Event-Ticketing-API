services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jogidb
      POSTGRES_DB: ticketingapi

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    ports:
      - "6379:6379"
